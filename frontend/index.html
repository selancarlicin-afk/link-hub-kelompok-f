<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resource Link Hub · Kelompok F</title>
  <meta name="description" content="Portal agregator tautan modul, slide, dan materi praktikum." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8102e'/%3E%3Cpath d='M13 19l6-6M11 15l-2 2a3.5 3.5 0 005 5l2-2M21 17l2-2a3.5 3.5 0 00-5-5l-2 2' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --brand: #c8102e;
      --brand-dark: #9e0c24;
      --brand-soft: #fdecef;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5f6b7a;
      --border: #e3e6ea;
      --ok: #1a7f4b;
      --ok-soft: #e4f5ec;
      --warn: #b45309;
      --err: #b42318;
      --err-soft: #fdecea;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
      --radius: 12px;
      --c-modul: #2563eb;
      --c-slide: #d97706;
      --c-video: #c8102e;
      --c-repositori: #7c3aed;
      --c-lainnya: #4b5563;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand: #ef4458;
        --brand-dark: #ff6b7c;
        --brand-soft: #3a1419;
        --bg: #0f1216;
        --surface: #171b21;
        --text: #e8ebef;
        --muted: #9aa4b2;
        --border: #2a3039;
        --ok: #4ade80;
        --ok-soft: #133022;
        --err: #f87171;
        --err-soft: #3a1717;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4);
        --c-modul: #60a5fa;
        --c-slide: #fbbf24;
        --c-video: #f87171;
        --c-repositori: #a78bfa;
        --c-lainnya: #9ca3af;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button, input, select, textarea { font: inherit; color: inherit; }

    /* ---------- Header ---------- */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-inner {
      max-width: 1180px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 10px; background: var(--brand);
      display: grid; place-items: center; flex: none;
    }
    .brand h1 { font-size: 1.1rem; margin: 0; letter-spacing: -.01em; }
    .brand p { margin: 0; color: var(--muted); font-size: .85rem; }
    .status {
      margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px; font-size: .8rem; font-weight: 600;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
    .status.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(26,127,75,.18); }
    .status.err { color: var(--err); background: var(--err-soft); border-color: transparent; }
    .status.err .dot { background: var(--err); }

    /* ---------- Layout ---------- */
    main {
      max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px;
      display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start;
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .panel { padding: 20px; position: sticky; top: 88px; }
    @media (max-width: 900px) { .panel { position: static; } }
    .panel h2 { font-size: 1rem; margin: 0 0 4px; }
    .panel .hint { color: var(--muted); font-size: .85rem; margin: 0 0 16px; }

    label { display: block; font-size: .82rem; font-weight: 600; margin: 12px 0 6px; }
    label .req { color: var(--brand); }
    input[type=text], input[type=url], input[type=search], select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    textarea { resize: vertical; min-height: 76px; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft);
    }
    .counter { float: right; font-weight: 400; color: var(--muted); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid transparent; border-radius: 8px; padding: 10px 16px;
      font-weight: 600; cursor: pointer; transition: background .15s, opacity .15s;
    }
    .btn-primary { background: var(--brand); color: #fff; width: 100%; margin-top: 18px; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-primary:disabled { opacity: .6; cursor: progress; }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); padding: 6px 10px; font-size: .8rem; }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-danger:hover { color: var(--err); border-color: var(--err); background: var(--err-soft); }
    .form-error {
      display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
      background: var(--err-soft); color: var(--err); font-size: .85rem;
    }
    .form-error.show { display: block; }

    /* ---------- Stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { padding: 14px 16px; }
    .stat .num { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
    .stat .lbl { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }

    /* ---------- Toolbar ---------- */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .toolbar input[type=search] { flex: 1 1 220px; background: var(--surface); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      padding: 6px 12px; border-radius: 999px; font-size: .8rem; font-weight: 600; cursor: pointer;
    }
    .chip:hover { color: var(--text); }
    .chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }

    /* ---------- Link list ---------- */
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .link {
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      border-top: 3px solid var(--cat, var(--c-lainnya));
    }
    .link.fresh { animation: pop .25s ease-out; }
    .link.removing { opacity: 0; transform: scale(.97); transition: opacity .2s, transform .2s; }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .link-head { display: flex; gap: 12px; align-items: flex-start; }
    .avatar {
      width: 38px; height: 38px; border-radius: 9px; flex: none;
      display: grid; place-items: center; font-weight: 700; color: #fff;
      background: var(--cat, var(--c-lainnya));
    }
    .link-title { font-weight: 650; margin: 0; font-size: .98rem; word-break: break-word; }
    .link-title a { text-decoration: none; }
    .link-title a:hover { color: var(--brand); text-decoration: underline; }
    .domain { color: var(--muted); font-size: .8rem; word-break: break-all; }
    .desc { color: var(--muted); font-size: .88rem; margin: 0; word-break: break-word; }
    .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; }
    .badge {
      font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
      color: var(--cat, var(--c-lainnya)); background: color-mix(in srgb, var(--cat, var(--c-lainnya)) 12%, transparent);
    }
    .time { font-size: .75rem; color: var(--muted); }
    .actions { margin-left: auto; display: flex; gap: 6px; }

    .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
    .empty strong { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }

    .skeleton { height: 150px; background: linear-gradient(90deg, var(--surface), var(--bg), var(--surface)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ---------- Toast ---------- */
    .toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
    .toast {
      background: var(--text); color: var(--surface); padding: 10px 14px; border-radius: 8px;
      font-size: .88rem; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: 340px;
      animation: pop .2s ease-out;
    }
    .toast.err { background: var(--err); color: #fff; }
    @media (max-width: 600px) { .toasts { left: 16px; right: 16px; bottom: 16px; } .toast { max-width: none; } }

    footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 20px 32px; }
    footer code { background: var(--surface); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <path d="M10 14l4-4M8.5 11.5l-2 2a3.5 3.5 0 005 5l2-2M15.5 12.5l2-2a3.5 3.5 0 00-5-5l-2 2"/>
        </svg>
      </div>
      <div class="brand">
        <h1>Resource Link Hub</h1>
        <p>Repositori Tautan Modul Praktikum · Kelompok F</p>
      </div>
      <span id="status" class="status" role="status" aria-live="polite">
        <span class="dot"></span><span id="status-text">Menghubungkan…</span>
      </span>
    </div>
  </header>

  <main>
    <!-- ================= Form tambah link ================= -->
    <section class="card panel" aria-labelledby="form-title">
      <h2 id="form-title">Tambah Tautan Materi</h2>
      <p class="hint">Bagikan modul, slide, video, atau repositori praktikum.</p>

      <form id="link-form" novalidate>
        <label for="title">Judul <span class="req">*</span><span class="counter" id="title-count">0/120</span></label>
        <input id="title" name="title" type="text" maxlength="120" placeholder="Modul 3 – Docker Networking" required />

        <label for="url">URL <span class="req">*</span></label>
        <input id="url" name="url" type="url" maxlength="2048" placeholder="https://…" required />

        <label for="category">Kategori</label>
        <select id="category" name="category">
          <option>Modul</option>
          <option>Slide</option>
          <option>Video</option>
          <option>Repositori</option>
          <option>Lainnya</option>
        </select>

        <label for="description">Deskripsi <span class="counter" id="desc-count">0/500</span></label>
        <textarea id="description" name="description" maxlength="500" placeholder="Opsional: ringkasan isi materi"></textarea>

        <div id="form-error" class="form-error" role="alert"></div>
        <button id="submit-btn" class="btn btn-primary" type="submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Simpan Tautan
        </button>
      </form>
    </section>

    <!-- ================= Daftar link ================= -->
    <section aria-labelledby="list-title">
      <h2 id="list-title" class="sr-only">Daftar tautan</h2>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <label for="search" class="sr-only">Cari tautan</label>
        <input id="search" type="search" placeholder="Cari judul, deskripsi, atau domain…" />
        <div class="chips" id="chips" role="group" aria-label="Filter kategori"></div>
      </div>

      <div id="list" class="list" aria-live="polite">
        <div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div>
      </div>
    </section>
  </main>

  <footer>
    Frontend: Nginx + Bind Mount · Backend: Python REST API + Named Volume <code>link-hub-data</code> · Network <code>app-net</code>
  </footer>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

<script>
  /* ==========================================================
   *  Resource Link Hub – Frontend (Vanilla JS, tanpa framework)
   *  Semua request lewat Nginx reverse proxy: /api/* -> backend:8000
   * ========================================================== */
  const API = "/api";
  const CATEGORIES = ["Modul", "Slide", "Video", "Repositori", "Lainnya"];
  const CAT_COLOR = {
    Modul: "var(--c-modul)", Slide: "var(--c-slide)", Video: "var(--c-video)",
    Repositori: "var(--c-repositori)", Lainnya: "var(--c-lainnya)",
  };
  const REFRESH_MS = 10000;

  const state = { links: [], filter: "Semua", query: "", online: null, version: "", seen: new Set() };
  const keyOf = (l) => `${l.created_at}|${l.url}|${l.title}`;
  const $ = (sel) => document.querySelector(sel);

  /* ---------- helper ---------- */
  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }
  function domainOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; }
  }
  function safeHref(url) {
    try {
      const u = new URL(url);
      return (u.protocol === "http:" || u.protocol === "https:") ? u.href : "#";
    } catch { return "#"; }
  }
  function timeAgo(iso) {
    const t = Date.parse(iso);
    if (Number.isNaN(t)) return "";
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return "baru saja";
    if (s < 3600) return `${Math.floor(s / 60)} menit lalu`;
    if (s < 86400) return `${Math.floor(s / 3600)} jam lalu`;
    return new Date(t).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }
  function toast(msg, isError = false) {
    const el = document.createElement("div");
    el.className = "toast" + (isError ? " err" : "");
    el.textContent = msg;
    $("#toasts").appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  async function request(path, options = {}) {
    const res = await fetch(API + path, {
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    let body = null;
    try { body = await res.json(); } catch { /* bukan JSON (mis. 502 dari nginx) */ }
    if (!res.ok) {
      const msg = body?.message || `HTTP ${res.status} ${res.statusText}`;
      throw new Error(msg);
    }
    return body;
  }

  /* ---------- status API ---------- */
  function setStatus(online, text) {
    state.online = online;
    $("#status").className = "status " + (online ? "ok" : "err");
    $("#status-text").textContent = text;
  }
  async function checkHealth() {
    try {
      const h = await request("/health");
      state.version = /^\d+$/.test(h.version) ? `build #${h.version}` : h.version;
      setStatus(true, `API online · ${state.version}`);
    } catch {
      setStatus(false, "API tidak terjangkau");
    }
  }

  /* ---------- load & render ---------- */
  async function loadLinks({ silent = false } = {}) {
    try {
      const res = await request("/links");
      const changed = JSON.stringify(res.data) !== JSON.stringify(state.links);
      state.links = res.data;
      if (changed || !silent) render();
      if (state.online === false) checkHealth();
      else if (state.version) setStatus(true, `API online · ${state.version}`);
    } catch (err) {
      if (!silent) {
        $("#list").innerHTML = `<div class="card empty" style="grid-column:1/-1">
          <strong>Gagal memuat data</strong>${escapeHtml(err.message)}</div>`;
        toast("Gagal memuat data: " + err.message, true);
      }
      setStatus(false, "API tidak terjangkau");
    }
  }

  function renderStats() {
    const counts = Object.fromEntries(CATEGORIES.map((c) => [c, 0]));
    state.links.forEach((l) => { counts[l.category] = (counts[l.category] || 0) + 1; });
    const tile = (num, label, color) => `
      <div class="card stat">
        <div class="num">${num}</div>
        <div class="lbl">${color ? `<span class="dot" style="width:8px;height:8px;border-radius:50%;background:${color}"></span>` : ""}${label}</div>
      </div>`;
    $("#stats").innerHTML = tile(state.links.length, "Total tautan")
      + CATEGORIES.filter((c) => c !== "Lainnya").map((c) => tile(counts[c], c, CAT_COLOR[c])).join("");
  }

  function renderChips() {
    const items = ["Semua", ...CATEGORIES];
    $("#chips").innerHTML = items.map((c) =>
      `<button type="button" class="chip ${state.filter === c ? "active" : ""}" data-cat="${c}" aria-pressed="${state.filter === c}">${c}</button>`
    ).join("");
  }

  function render() {
    renderStats();
    renderChips();
    const q = state.query.toLowerCase();
    // Simpan index ASLI dari server agar DELETE /links?index=X tepat sasaran walau sedang difilter
    const rows = state.links
      .map((link, index) => ({ link, index }))
      .filter(({ link }) => state.filter === "Semua" || link.category === state.filter)
      .filter(({ link }) => !q || [link.title, link.description, link.url].join(" ").toLowerCase().includes(q))
      .reverse(); // terbaru di atas

    if (rows.length === 0) {
      const none = state.links.length === 0;
      $("#list").innerHTML = `<div class="card empty" style="grid-column:1/-1">
        <strong>${none ? "Belum ada tautan" : "Tidak ada yang cocok"}</strong>
        ${none ? "Tambahkan tautan materi pertama lewat form di samping." : "Coba kata kunci atau kategori lain."}
      </div>`;
      return;
    }

    const html = rows.map(({ link, index }) => {
      const color = CAT_COLOR[link.category] || CAT_COLOR.Lainnya;
      const fresh = state.seen.has(keyOf(link)) ? "" : " fresh"; // animasi hanya untuk item baru
      return `
      <article class="card link${fresh}" style="--cat:${color}" data-index="${index}">
        <div class="link-head">
          <div class="avatar" aria-hidden="true">${escapeHtml(link.category?.[0] || "?")}</div>
          <div style="min-width:0">
            <h3 class="link-title"><a href="${escapeHtml(safeHref(link.url))}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.title)}</a></h3>
            <div class="domain">${escapeHtml(domainOf(link.url))}</div>
          </div>
        </div>
        ${link.description ? `<p class="desc">${escapeHtml(link.description)}</p>` : ""}
        <div class="meta">
          <span class="badge">${escapeHtml(link.category)}</span>
          <span class="time" title="${escapeHtml(link.created_at)}">#${index} · ${timeAgo(link.created_at)}</span>
          <div class="actions">
            <button class="btn btn-ghost" data-action="copy" data-index="${index}" title="Salin URL">Salin</button>
            <button class="btn btn-ghost btn-danger" data-action="delete" data-index="${index}" title="Hapus tautan">Hapus</button>
          </div>
        </div>
      </article>`;
    }).join("");
    $("#list").innerHTML = html;
    state.links.forEach((l) => state.seen.add(keyOf(l)));
  }

  /* ---------- actions ---------- */
  async function addLink(evt) {
    evt.preventDefault();
    const errBox = $("#form-error");
    errBox.classList.remove("show");
    const payload = {
      title: $("#title").value.trim(),
      url: $("#url").value.trim(),
      category: $("#category").value,
      description: $("#description").value.trim(),
    };
    // Validasi ringan di sisi klien (validasi utama tetap di backend)
    if (!payload.title || !payload.url) {
      errBox.textContent = "Judul dan URL wajib diisi.";
      return errBox.classList.add("show");
    }
    // "github.com/x" -> "https://github.com/x" (hanya jika belum ada skema sama sekali)
    if (!/^[a-z][a-z0-9+.-]*:/i.test(payload.url)) payload.url = "https://" + payload.url;

    const btn = $("#submit-btn");
    btn.disabled = true;
    try {
      await request("/links", { method: "POST", body: JSON.stringify(payload) });
      evt.target.reset();
      updateCounters();
      toast("Tautan tersimpan ✓");
      state.filter = "Semua";
      await loadLinks();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add("show");
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteLink(index, card) {
    const link = state.links[index];
    if (!link || !confirm(`Hapus tautan "${link.title}"?`)) return;
    card?.classList.add("removing");
    try {
      await request(`/links?index=${index}`, { method: "DELETE" });
      toast("Tautan dihapus");
    } catch (err) {
      card?.classList.remove("removing");
      toast("Gagal menghapus: " + err.message, true);
    } finally {
      await loadLinks(); // sinkron ulang index dari server
    }
  }

  async function copyLink(index) {
    const link = state.links[index];
    if (!link) return;
    try {
      await navigator.clipboard.writeText(link.url);
      toast("URL disalin ke clipboard");
    } catch {
      prompt("Salin URL berikut:", link.url);
    }
  }

  function updateCounters() {
    $("#title-count").textContent = `${$("#title").value.length}/120`;
    $("#desc-count").textContent = `${$("#description").value.length}/500`;
  }

  /* ---------- events ---------- */
  $("#link-form").addEventListener("submit", addLink);
  $("#title").addEventListener("input", updateCounters);
  $("#description").addEventListener("input", updateCounters);
  $("#search").addEventListener("input", (e) => { state.query = e.target.value; render(); });
  $("#chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    state.filter = chip.dataset.cat;
    render();
  });
  $("#list").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const index = Number(btn.dataset.index);
    if (btn.dataset.action === "delete") deleteLink(index, btn.closest(".link"));
    if (btn.dataset.action === "copy") copyLink(index);
  });

  /* ---------- init ---------- */
  checkHealth();
  loadLinks();
  // Auto-refresh: perubahan dari user/tab lain ikut tampil tanpa reload halaman
  setInterval(() => { if (!document.hidden) loadLinks({ silent: true }); }, REFRESH_MS);
  setInterval(checkHealth, REFRESH_MS * 3);
</script>
</body>
</html>
