# Nginx untuk frontend Resource Link Hub
# - Menyajikan index.html dari Bind Mount (/usr/share/nginx/html)
# - Reverse proxy /api/* -> service "backend" (DNS internal Docker di network app-net)

server {
    listen 80;
    server_name _;

    # DNS internal Docker. Nama "backend" (nama service di docker-compose.yml)
    # di-resolve ulang tiap 10 detik, sehingga proxy tetap jalan walaupun
    # kontainer backend dihapus lalu dibuat ulang dengan IP baru.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    root  /usr/share/nginx/html;
    index index.html;

    # Matikan cache agar perubahan index.html (bind mount) langsung terlihat
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # /api/links  ->  http://backend:8000/links
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
        # Backend mati -> balas JSON yang rapi (bukan halaman HTML 502)
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"status":"error","code":503,"message":"Backend sedang tidak tersedia, coba lagi sebentar."}';
    }

    # Endpoint health milik Nginx sendiri
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
