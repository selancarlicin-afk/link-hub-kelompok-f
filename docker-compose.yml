# =====================================================================
#  Resource Link Hub - Kelompok F (Cloud Computing - Ujian Chunin)
#  Stack: frontend (Nginx + bind mount) <-> backend (Python API + named volume)
# =====================================================================
name: linkhub

services:
  backend:
    build:
      context: ./backend
    image: linkhub-backend:${IMAGE_TAG:-latest}
    container_name: linkhub-backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      DATA_DIR: /var/lib/backend_data
      DATA_FILE: links.json
      APP_VERSION: ${IMAGE_TAG:-latest}
    volumes:
      # Named Volume -> data tetap ada walaupun kontainer dihapus (docker rm -f)
      - link-hub-data:/var/lib/backend_data
    ports:
      - "8000:8000"            # dibuka untuk pengujian API langsung (curl/Postman)
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    image: nginx:1.27-alpine
    container_name: linkhub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Bind Mount -> edit frontend/index.html, refresh browser, langsung berubah (tanpa rebuild)
      # HOST_PROJECT_DIR diisi otomatis oleh Jenkinsfile saat deploy dari Jenkins
      - ${HOST_PROJECT_DIR:-.}/frontend:/usr/share/nginx/html:ro
      - ${HOST_PROJECT_DIR:-.}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"              # UI: http://localhost:8081
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  app-net:
    name: app-net              # Custom Bridge Network (terisolasi)
    driver: bridge

volumes:
  link-hub-data:
    name: link-hub-data        # Named Volume (nama tetap, tidak diberi prefix project)
