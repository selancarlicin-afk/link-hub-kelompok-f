# Jenkins Configuration as Code (JCasC)
# Nilai ${...} diambil dari file jenkins/.env
jenkins:
  systemMessage: "CI/CD Resource Link Hub - Kelompok F (Cloud Computing)"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL:-http://localhost:8080/}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_PAT}"
              description: "Jenkins CI/CD UTS Token (GitHub PAT)"

jobs:
  - script: >
      pipelineJob('linkhub-pipeline') {
        displayName('Resource Link Hub - CI/CD')
        description('Pipeline otomatis: GitHub Webhook -> Checkout -> Syntax Check -> Build Image -> Deploy -> Health Check')
        properties {
          githubProjectUrl('${REPO_URL}')
          pipelineTriggers {
            triggers {
              githubPush()
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${REPO_URL}')
                  credentials('github-pat')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
